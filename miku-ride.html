<title>初音未来骑单车</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: one centered stage; the animated canvas is the hero, a slim control strip sits under it */
:root {
  --bg: #edf6f5;
  --surface: #ffffff;
  --fg: #163634;
  --muted: #56716f;
  --accent: #11857b;
  --accent-2: #d93d77;
  --line: #cfe2df;
  --font-display: "ZCOOL KuaiLe", "Noto Sans SC", system-ui, sans-serif;
  --font-body: "Noto Sans SC", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1b1b; --surface: #152829; --fg: #e2f3f1; --muted: #94b3b0;
    --accent: #46d4c8; --accent-2: #ff7eab; --line: #28403f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1b1b; --surface: #152829; --fg: #e2f3f1; --muted: #94b3b0;
  --accent: #46d4c8; --accent-2: #ff7eab; --line: #28403f; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 28px; display: grid; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 4vw, 38px); margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); margin: 0; font-size: 14px; line-height: 1.6; max-width: 46ch; }
.stage { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 10 / 7; height: auto; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.speed { display: flex; align-items: center; gap: 10px; flex: 1 1 260px; min-width: 0; }
.speed label { font-weight: 700; white-space: nowrap; }
.speed input { flex: 1; min-width: 0; accent-color: var(--accent); }
output { font-variant-numeric: tabular-nums; min-width: 5.5em; color: var(--muted); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: inherit; font-weight: 700; border-radius: 999px; padding: 8px 18px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
button.primary { background: var(--accent); color: var(--bg); }
button:hover { filter: brightness(1.08); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }
</style>

<div class="wrap">
  <header>
    <h1>初音未来<span>骑单车</span></h1>
    <p class="sub">拖动车速，双马尾、鬓发和裙摆会跟着风变；车速调到 0，头发会自然垂下来。</p>
  </header>
  <div class="stage">
    <canvas id="scene" role="img" aria-label="初音未来骑着白色自行车在樱花路上前进，车篮里插着一根大葱，青色双马尾随风飘动"></canvas>
  </div>
  <div class="controls">
    <div class="speed">
      <label for="speed">车速</label>
      <input id="speed" type="range" min="0" max="16" step="0.5" value="8">
      <output id="speedOut" for="speed">5.5 km/h</output>
    </div>
    <div class="btns">
      <button id="bell" type="button" class="primary">按铃</button>
      <button id="pause" type="button">暂停</button>
    </div>
  </div>
</div>

<script>
(() => {
  const W = 1000, H = 700;
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');
  let S = 1;

  // ------------------------------------------------------------ vectors
  const V = (x, y) => ({ x, y });
  const add = (a, b) => V(a.x + b.x, a.y + b.y);
  const sub = (a, b) => V(a.x - b.x, a.y - b.y);
  const mul = (a, k) => V(a.x * k, a.y * k);
  const len = a => Math.hypot(a.x, a.y);
  const norm = a => { const l = len(a) || 1e-6; return V(a.x / l, a.y / l); };
  const perp = a => V(-a.y, a.x);
  const lerp = (a, b, t) => V(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
  const rot = (a, r) => V(a.x * Math.cos(r) - a.y * Math.sin(r), a.x * Math.sin(r) + a.y * Math.cos(r));
  const ss = x => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
  const DEG = Math.PI / 180;

  function solveJoint(a, b, l1, l2, pick) {
    let d = len(sub(b, a));
    d = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.01), l1 + l2 - 0.01);
    const x = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(l1 * l1 - x * x, 0));
    const u = norm(sub(b, a)), n = perp(u), base = add(a, mul(u, x));
    return pick(add(base, mul(n, h)), sub(base, mul(n, h)));
  }

  // ------------------------------------------------------------ drawing helpers
  const cache = new Map();
  const P = d => { let p = cache.get(d); if (!p) { p = new Path2D(d); cache.set(d, p); } return p; };
  const fill = (path, color, alpha = 1) => { ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fill(typeof path === 'string' ? P(path) : path); ctx.globalAlpha = 1; };
  const stroke = (path, color, lw, alpha = 1) => {
    ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke(typeof path === 'string' ? P(path) : path); ctx.globalAlpha = 1;
  };
  const line = (a, b, color, lw, alpha = 1) => { const p = new Path2D(); p.moveTo(a.x, a.y); p.lineTo(b.x, b.y); stroke(p, color, lw, alpha); };
  const circle = (x, y, r) => { const p = new Path2D(); p.arc(x, y, r, 0, Math.PI * 2); return p; };
  const ellipse = (x, y, rx, ry) => { const p = new Path2D(); p.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); return p; };
  function rrect(x, y, w, h, r) {
    const p = new Path2D();
    p.moveTo(x + r, y); p.arcTo(x + w, y, x + w, y + h, r); p.arcTo(x + w, y + h, x, y + h, r);
    p.arcTo(x, y + h, x, y, r); p.arcTo(x, y, x + w, y, r); p.closePath(); return p;
  }
  function capsule(p1, p2, r1, r2) {
    const d = sub(p2, p1), phi = Math.atan2(d.y, d.x), n = perp(norm(d)), p = new Path2D();
    p.moveTo(p1.x + n.x * r1, p1.y + n.y * r1);
    p.lineTo(p2.x + n.x * r2, p2.y + n.y * r2);
    p.arc(p2.x, p2.y, r2, phi + Math.PI / 2, phi - Math.PI / 2, true);
    p.lineTo(p1.x - n.x * r1, p1.y - n.y * r1);
    p.arc(p1.x, p1.y, r1, phi - Math.PI / 2, phi + Math.PI / 2, true);
    p.closePath(); return p;
  }
  function band(p1, p2, r1, r2) {
    const n = perp(norm(sub(p2, p1))), p = new Path2D();
    p.moveTo(p1.x + n.x * r1, p1.y + n.y * r1); p.lineTo(p2.x + n.x * r2, p2.y + n.y * r2);
    p.lineTo(p2.x - n.x * r2, p2.y - n.y * r2); p.lineTo(p1.x - n.x * r1, p1.y - n.y * r1); p.closePath(); return p;
  }

  // ------------------------------------------------------------ palette
  const SKIN = '#ffe6d8', SKIN_SH = '#f4c7b4', SKIN_FAR = '#e3b39f';
  const HAIR = '#3cc8bd', HAIR_L = '#8ae6dc', HAIR_D = '#22a399', HAIR_DD = '#147a72';
  const SHIRT = '#dfe3e8', SHIRT_SH = '#b8bec7';
  const BLK = '#2a2b31', BLK_FAR = '#1b1c20', BLK_HI = '#4a4c56';
  const TEAL = '#2fc6b8', PINK = '#ff5c93';

  // ------------------------------------------------------------ rig (scene units, 1000 x 700)
  const GROUND = 622;
  const RW = V(300, 510), FW = V(690, 510), R = 104;
  const BB = V(470, 522), CRANK = 46, GEAR = 1.5;
  const SEAT = V(424, 352), SEAT_TOP = V(436, 388);
  const HEAD_TOP = V(642, 350), HEAD_BOT = V(655, 402), STEM = V(632, 294);
  const GRIP_N = V(598, 300), GRIP_F = V(606, 294);
  const HIP_N = V(420, 334), HIP_F = V(414, 336);
  const THIGH = 120, SHIN = 116, UPPER = 98, FORE = 94;
  const SH_N0 = V(446, 200), SH_F0 = V(440, 196);
  const HEAD0 = V(482, 102);
  const TIE_R = V(-40, -32), TIE_L = V(39, -36);
  const pickFwd = (a, b) => (a.x > b.x ? a : b);
  const pickDown = (a, b) => (a.y > b.y ? a : b);

  // ------------------------------------------------------------ state
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speedInput = document.getElementById('speed');
  const speedOut = document.getElementById('speedOut');
  let target = +speedInput.value, speed = target;
  let dist = 0, phase = 0, clock = 0;
  let paused = reduceMotion;
  let blinkIn = 120, blinkFor = 0, bellShake = 0, humIn = 40;
  const notes = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  const petals = Array.from({ length: 16 }, () => ({ x: rand(0, 1100), y: rand(0, 600), r: rand(0, 6), spin: rand(-0.06, 0.06), ph: rand(0, 6), s: rand(0.7, 1.2) }));
  const streaks = Array.from({ length: 8 }, () => ({ x: rand(0, 1200), y: rand(230, 520), l: rand(60, 150) }));

  // ------------------------------------------------------------ hair physics (verlet ropes)
  function makeRope(n, seg) { return { n, seg, p: Array.from({ length: n }, () => ({ x: 0, y: 0, px: 0, py: 0 })) }; }
  const ropeA = makeRope(22, 20); // from her right tie (screen left)
  const ropeB = makeRope(22, 20); // from her left tie, arcs over the head
  function seedRope(r, a, dir) {
    r.p.forEach((q, i) => { q.x = q.px = a.x + dir.x * r.seg * i; q.y = q.py = a.y + dir.y * r.seg * i; });
  }
  const K = 0.1, G = 0.22;
  function stepRope(r, a, dir, lift, ph) {
    const pts = r.p;
    pts[0].x = pts[0].px = a.x; pts[0].y = pts[0].py = a.y;
    for (let i = 1; i < r.n; i++) {
      const q = pts[i], vx = q.x - q.px, vy = q.y - q.py, f = i / (r.n - 1);
      const wind = -speed * (0.9 + 0.2 * f);
      const turb = speed * (0.22 * Math.sin(phase * 1.3 + ph - i * 0.55) + 0.08 * Math.sin(phase * 2.9 + ph - i * 1.1));
      q.px = q.x; q.py = q.y;
      q.x += vx * 0.99 + K * (wind - vx);
      q.y += vy * 0.99 + G - lift * speed + K * (turb - vy);
    }
    for (let it = 0; it < 10; it++) {
      pts[1].x = a.x + dir.x * r.seg; pts[1].y = a.y + dir.y * r.seg;
      for (let i = 2; i < r.n; i++) {
        const A = pts[i - 1], B = pts[i];
        const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1e-6, diff = (d - r.seg) / d;
        if (i === 2) { B.x -= dx * diff; B.y -= dy * diff; }
        else { A.x += dx * diff * 0.5; A.y += dy * diff * 0.5; B.x -= dx * diff * 0.5; B.y -= dy * diff * 0.5; }
      }
    }
  }
  function smooth(pts, sub = 4) {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
      for (let k = 0; k < sub; k++) {
        const t = k / sub, t2 = t * t, t3 = t2 * t;
        out.push(V(
          0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
          0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)));
      }
    }
    out.push(V(pts[pts.length - 1].x, pts[pts.length - 1].y));
    return out;
  }
  function tailWidth(root, mid, s) {
    const tip = 0.62;
    if (s < 0.12) return root + (mid - root) * ss(s / 0.12);
    if (s < tip) return mid + 4 * Math.sin((s - 0.12) / (tip - 0.12) * Math.PI);
    return mid * Math.pow(1 - ss((s - tip) / (1 - tip)), 0.8);
  }
  function drawTail(r, root, mid, stops, strands) {
    const c = smooth(r.p), N = c.length, L = [], Rr = [], normals = [];
    for (let i = 0; i < N; i++) {
      const n = perp(norm(sub(c[Math.min(i + 1, N - 1)], c[Math.max(i - 1, 0)])));
      normals.push(n);
      const w = tailWidth(root, mid, i / (N - 1));
      L.push(add(c[i], mul(n, w))); Rr.push(sub(c[i], mul(n, w)));
    }
    const path = new Path2D();
    path.moveTo(L[0].x, L[0].y);
    L.forEach(p => path.lineTo(p.x, p.y));
    for (let i = N - 1; i >= 0; i--) path.lineTo(Rr[i].x, Rr[i].y);
    path.closePath();
    const g = ctx.createLinearGradient(c[N - 1].x, c[N - 1].y, c[0].x, c[0].y);
    stops.forEach(([o, col]) => g.addColorStop(o, col));
    fill(path, g);
    stroke(path, HAIR_DD, 1.2, 0.35);
    for (const [k, s0, s1, col, lw] of strands) {
      const sp = new Path2D(); let first = true;
      for (let i = 0; i < N; i++) {
        const s = i / (N - 1); if (s < s0 || s > s1) continue;
        const q = add(c[i], mul(normals[i], tailWidth(root, mid, s) * k));
        if (first) { sp.moveTo(q.x, q.y); first = false; } else sp.lineTo(q.x, q.y);
      }
      stroke(sp, col, lw, 0.75);
    }
  }

  // ------------------------------------------------------------ pose for the current frame
  function pose() {
    const theta = -35 * DEG + dist / R / GEAR;
    const bob = 1.2 * Math.sin(2 * theta);
    const headAng = (-3 + 1.2 * Math.sin(theta)) * DEG;
    const pedN = add(BB, V(CRANK * Math.cos(theta), CRANK * Math.sin(theta)));
    const pedF = sub(BB, V(CRANK * Math.cos(theta), CRANK * Math.sin(theta)));
    const footN = 12 + 10 * Math.sin(theta), footF = 12 + 10 * Math.sin(theta + Math.PI);
    const ball = V(24, 21);
    const ankN = sub(pedN, rot(ball, footN * DEG)), ankF = sub(pedF, rot(ball, footF * DEG));
    const kneeN = solveJoint(HIP_N, ankN, THIGH, SHIN, pickFwd);
    const kneeF = solveJoint(HIP_F, ankF, THIGH, SHIN, pickFwd);
    const shN = add(SH_N0, V(0, bob)), shF = add(SH_F0, V(0, bob));
    const wrN = add(GRIP_N, V(-6, -2)), wrF = add(GRIP_F, V(-6, -2));
    const elbN = solveJoint(shN, wrN, UPPER, FORE, pickDown);
    const elbF = solveJoint(shF, wrF, UPPER, FORE, pickDown);
    const head = add(HEAD0, V(0, bob));
    return { theta, bob, headAng, pedN, pedF, footN, footF, ankN, ankF, kneeN, kneeF, shN, shF, elbN, elbF, wrN, wrF, head };
  }
  const ties = pz => ({
    a: add(pz.head, rot(TIE_R, pz.headAng)), b: add(pz.head, rot(TIE_L, pz.headAng)),
  });
  // root directions: hanging behind her back when still, streaming back in the wind;
  // the far tail (her left) passes behind the head and rides a little higher
  const windMix = () => Math.min(Math.max(speed / 4, 0), 1);
  const dirA = () => norm(lerp(V(-0.35, 1), V(-1, 0.25), windMix()));
  const dirB = () => norm(lerp(V(-0.2, 1), V(-1, -0.35), windMix()));

  // ------------------------------------------------------------ background
  function background() {
    const sky = ctx.createLinearGradient(0, 0, 0, 600);
    sky.addColorStop(0, '#9ee3f0'); sky.addColorStop(0.7, '#dff6f7'); sky.addColorStop(1, '#f6fcfb');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    fill(circle(850, 105, 70), '#fff6c8', 0.35); fill(circle(850, 105, 52), '#fff6c8');
    [[170, 80, 1], [620, 60, 0.8], [930, 200, 0.7]].forEach(([cx, cy, s]) => {
      const x = ((cx - dist * 0.04) % 1300 + 1300) % 1300 - 150;
      ctx.save(); ctx.translate(x, cy); ctx.scale(s, s);
      fill(ellipse(0, 0, 70, 20), '#fff', 0.92); fill(ellipse(-22, -14, 34, 22), '#fff', 0.92); fill(ellipse(20, -18, 38, 26), '#fff', 0.92);
      ctx.restore();
    });
    const hills = (base, a1, f1, a2, f2, o, col) => {
      const p = new Path2D(); p.moveTo(0, 600);
      for (let x = 0; x <= W; x += 10) p.lineTo(x, base - a1 * Math.sin((x + o) * f1) - a2 * Math.sin((x + o) * f2 + 1.3));
      p.lineTo(W, 600); p.closePath(); fill(p, col);
    };
    hills(512, 30, 0.005, 18, 0.012, dist * 0.12, '#c4ecdc');
    hills(560, 16, 0.008, 10, 0.017, dist * 0.25, '#a5dcbf');
    const o = dist * 0.4, sp = 210, i0 = Math.floor(o / sp);
    for (let i = i0 - 1; i < i0 + 7; i++) {
      const h = Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;
      const x = i * sp - o + 60, y = 548 + h * 12, s = 0.7 + h * 0.35;
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      fill(rrect(-5, -10, 10, 45, 2), '#b58b6b');
      fill(circle(0, -38, 34), '#ffc2d6'); fill(circle(-20, -22, 22), '#ffb0c9'); fill(circle(22, -26, 22), '#ffd3e1');
      ctx.restore();
    }
    ctx.fillStyle = '#8fd17a'; ctx.fillRect(0, 592, W, 16);
    const road = ctx.createLinearGradient(0, 606, 0, 700);
    road.addColorStop(0, '#a7adb5'); road.addColorStop(1, '#8b9199');
    ctx.fillStyle = road; ctx.fillRect(0, 606, W, 94);
    ctx.fillStyle = '#c9ced4'; ctx.fillRect(0, 606, W, 5);
    ctx.fillStyle = '#f4f6f7';
    for (let x = -(dist % 90); x < W; x += 90) ctx.fillRect(x, 663, 50, 6);
    const a = Math.min(Math.max((speed - 3) / 8, 0), 1) * 0.85;
    if (a > 0) streaks.forEach(s => line(V(s.x, s.y), V(s.x + s.l, s.y), '#ffffff', 4, a));
    ctx.globalAlpha = 0.18; fill(ellipse(495, GROUND + 2, 270, 10), '#3d4148'); ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------ bike
  function wheel(c, ang) {
    ctx.save(); ctx.translate(c.x, c.y);
    stroke(circle(0, 0, R), '#2b2c31', 12);
    stroke(circle(0, 0, R - 2), '#45474f', 2);
    stroke(circle(0, 0, R - 9), '#d7dde3', 4);
    ctx.rotate(ang);
    const sp = new Path2D();
    for (let k = 0; k < 12; k++) {
      const a = (k * 30 + (k % 2 ? 7 : 0)) * DEG;
      sp.moveTo(0, 0); sp.lineTo(Math.cos(a) * (R - 10), Math.sin(a) * (R - 10));
    }
    stroke(sp, '#a4abb3', 1.5);
    fill(circle(R - 22, 0, 4), TEAL);
    fill(circle(0, 0, 11), '#c9d0d7'); fill(circle(0, 0, 5), '#6b7078');
    ctx.restore();
  }
  function arcPath(c, r, a0, a1) { const p = new Path2D(); p.arc(c.x, c.y, r, a0 * DEG, a1 * DEG); return p; }
  function tube(d, w) { stroke(d, '#b8c4ce', w + 3); stroke(d, '#ffffff', w); }

  function bikeBack(pz) {
    wheel(RW, dist / R); wheel(FW, dist / R);
    stroke(arcPath(RW, R + 14, 195, 320), '#b8c4ce', 12); stroke(arcPath(RW, R + 14, 195, 320), '#ffffff', 9);
    stroke(arcPath(FW, R + 14, 215, 340), '#b8c4ce', 12); stroke(arcPath(FW, R + 14, 215, 340), '#ffffff', 9);
    tube(`M${BB.x},${BB.y} L${RW.x},${RW.y}`, 8);
    tube(`M${SEAT_TOP.x},${SEAT_TOP.y} L${RW.x},${RW.y}`, 7);
    // drivetrain
    stroke(circle(BB.x, BB.y, 27), '#8e949c', 5);
    const spider = new Path2D();
    for (let k = 0; k < 5; k++) { const a = pz.theta + k * Math.PI * 2 / 5; spider.moveTo(BB.x, BB.y); spider.lineTo(BB.x + Math.cos(a) * 24, BB.y + Math.sin(a) * 24); }
    stroke(spider, '#a0a6ad', 3);
    stroke(circle(RW.x, RW.y, 12), '#8e949c', 4);
    stroke(`M${BB.x},${BB.y - 27} L${RW.x},${RW.y - 12} M${BB.x},${BB.y + 27} L${RW.x},${RW.y + 12}`, '#6d737b', 2.5);
    // step-through frame

  function simulate(dt) {
    speed += (target - speed) * Math.min(0.05 * dt, 1);
    if (Math.abs(target - speed) < 0.01) speed = target;
    dist += speed * dt;
    phase += dt * (0.03 + speed * 0.012);
    clock += dt;
    const steps = Math.max(1, Math.min(4, Math.round(dt)));
    for (let k = 0; k < steps; k++) {
      const t = ties(pose());
      stepRope(ropeB, t.b, dirB(), 0.022, 1.7);
      stepRope(ropeA, t.a, dirA(), -0.006, 0);
    }
    if (blinkFor > 0) blinkFor -= dt;
    else if ((blinkIn -= dt) <= 0) { blinkFor = 8; blinkIn = rand(150, 320); }
    if (bellShake > 0) bellShake = Math.max(0, bellShake - dt * 0.4);
    if (speed > 0.5 && (humIn -= dt) <= 0) {
      humIn = rand(50, 90);
      const pz = pose();
      notes.push({ x: pz.head.x + 10, y: pz.head.y + 30, vx: -0.4 - speed * 0.07, vy: -0.7, life: 1, age: 0,
        ch: Math.random() < 0.5 ? '♪' : '♫', col: Math.random() < 0.7 ? TEAL : PINK, size: rand(22, 32) });
    }
    for (const n of notes) { n.x += n.vx * dt; n.y += n.vy * dt; n.life -= 0.007 * dt; n.age += dt; }
    for (let i = notes.length - 1; i >= 0; i--) if (notes[i].life <= 0) notes.splice(i, 1);
    for (const p of petals) {
      p.x -= (0.5 + speed * 0.9) * dt; p.y += (0.35 + 0.4 * Math.sin(clock * 0.02 + p.ph)) * dt; p.r += p.spin * dt;
      if (p.x < -20) { p.x = W + rand(10, 200); p.y = rand(0, 560); }
      if (p.y > 620) { p.y = -10; }
    }
    for (const s of streaks) {
      s.x -= speed * 2.6 * dt;
      if (s.x + s.l < 0) { s.x = W + rand(0, 300); s.y = rand(230, 520); s.l = rand(60, 150); }
    }
  }

  let audio = null;

        const o = audio.createOscillator(), g = audio.createGain();

        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 1.1);
        o.connect(g).connect(audio.destination); o.start(t0 + d); o.stop(t0 + d + 1.2);
      });
    } catch (e) { /* sound is optional */ }
    bellShake = 6;
    for (let i = 0; i < 3; i++) notes.push({ x: 622 + i * 14, y: 270 - i * 8, vx: -0.3 - speed * 0.05, vy: -1.1 - i * 0.2, life: 1, age: i * 20, ch: '♪', col: PINK, size: 26 });
    if (paused) draw();
  });

  if (!paused) start(); else draw();
})();
